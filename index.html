<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Weather Widget</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .settings {
      margin-right: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .settings label {
      display: block;
      margin-top: 10px;
    }
    .weather-widget {
      width: 360px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      overflow: hidden;
      background-color: white;
    }
    .header {
      background: linear-gradient(135deg, #86b4dc 0%, #86b4dc 100%);
      color: white;
      padding: 20px;
    }
    .header-title {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }
    .header-location {
      display: flex;
      align-items: center;
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
    }
    .header-location img {
      width: 16px;
      height: 16px;
      margin-right: 6px;
      filter: brightness(0) invert(1);
    }
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .header-main .temp {
      font-size: 32px;
      font-weight: bold;
      line-height: 1;
    }
    .header-main .desc {
      display: flex;
      align-items: center;
      font-size: 14px;
      opacity: 0.9;
    }
    .header-main .desc img {
      width: 24px;
      height: 24px;
      margin-right: 6px;
    }
    .forecast {
      display: flex;
      justify-content: space-between;
      background: #ffffff;
      padding: 20px;
    }
    .day {
      flex: 1;
      text-align: center;
    }
    .day img {
      width: 36px;
      height: 36px;
    }
    .day-name {
      margin-top: 8px;
      font-size: 14px;
      color: #333;
    }
    .day-temp {
      margin-top: 4px;
      font-size: 16px;
      font-weight: bold;
      color: #000;
    }
    .day-min {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }
    .advice {
      padding: 10px 20px;
      font-size: 14px;
      background-color: #f9f9f9;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>

  <div class="settings">
    <h3>Settings</h3>
    <label>
      Location:
      <input id="cityInput" type="text" value="London" />
    </label>
    <label>
      Language:
      <select id="langSelect">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="hi">Hindi</option>
        <option value="ja">Japanese</option>
      </select>
    </label>
    <label>
      Units:
      <select id="unitSelect">
        <option value="metric" selected>Celsius (°C)</option>
        <option value="imperial">Fahrenheit (°F)</option>
      </select>
    </label>
    <label>
      Font Size:
      <select id="fontSizeSelect">
        <option value="14px">Small</option>
        <option value="16px" selected>Medium</option>
        <option value="18px">Large</option>
      </select>
    </label>
    <label>
      Font Family:
      <select id="fontFamilySelect">
        <option value="'Segoe UI', sans-serif">Segoe UI</option>
        <option value="'Arial', sans-serif">Arial</option>
        <option value="'Roboto', sans-serif">Roboto</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
      </select>
    </label>
    <br><br>
    <button onclick="applySettings()">Apply</button>
  </div>

  <div class="weather-widget" id="widget">
    <div class="header">
      <p class="header-title">Upcoming forecast:</p>
      <div class="header-location">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="location" />
        <span id="city">Loading...</span>
      </div>
      <div class="header-main">
        <div class="temp" id="temp">--°C</div>
        <div class="desc">
          <img id="icon" src="" alt="weather icon" />
          <span id="desc-text">Loading...</span>
        </div>
      </div>
    </div>
    <div class="forecast" id="forecast">
      <!-- 3-day forecast cards -->
    </div>
    <div class="advice" id="advice"></div>
  </div>

  <script>
    const API_KEY = '147f7372be2f809924b8182a9a98cdd7';

    async function renderWidget(city, lang = 'en', units = 'metric') {
      try {
        const geoRes = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=1&appid=${API_KEY}`);
        const geoData = await geoRes.json();
        if (!geoData.length) return;

        const { lat, lon, name } = geoData[0];
        const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=${units}&lang=${lang}&appid=${API_KEY}`);
        const data = await res.json();

        const current = data.list[0];
        const iconCode = current.weather[0].icon;

        document.getElementById('city').textContent = name;
        document.getElementById('temp').textContent = `${Math.round(current.main.temp)}°${units === 'metric' ? 'C' : 'F'}`;
        document.getElementById('icon').src = `custom-icons/${iconCode}.png`;
        console.log("Icon code:", current.weather[0].icon);
        document.getElementById('desc-text').textContent = current.weather[0].description;

        const advice = getAdvice(current.main.temp, current.weather[0].main.toLowerCase(), units);
        document.getElementById('advice').textContent = advice;

        const daysMap = {};

data.list.forEach(item => {
  const date = new Date(item.dt_txt);
  const hours = date.getHours();
  const day = date.toLocaleDateString(lang, { weekday: 'long' });

  if (!daysMap[day]) {
    daysMap[day] = {
      max: item.main.temp_max,
      min: item.main.temp_min,
      icon: '', // set later
      iconScore: Infinity // to get closest to 12:00
    };
  } else 
  {
    daysMap[day].max = Math.max(daysMap[day].max, item.main.temp_max);
    daysMap[day].min = Math.min(daysMap[day].min, item.main.temp_min);
  }

  // Choose icon closest to 12:00 PM (noon)
  const score = Math.abs(hours - 12);
  if (score < daysMap[day].iconScore) 
  {
    daysMap[day].icon = item.weather[0].icon;
    daysMap[day].iconScore = score;
  }
  });

        const keys = Object.keys(daysMap).slice(1, 4);
        const forecastEl = document.getElementById('forecast');
        forecastEl.innerHTML = keys.map(day => `
          <div class="day">
            <img src="custom-icons/${daysMap[day].icon}.png" alt="icon">
            <div class="day-name">${day}</div>
            <div class="day-temp">${Math.round(daysMap[day].max)}°</div>
            <div class="day-min">${Math.round(daysMap[day].min)}°</div>
          </div>
        `).join('');
      } catch (e) {
        console.error("Failed to fetch weather:", e);
      }
    }

    function getAdvice(temp, condition, units) {
      const c = units === 'metric' ? temp : (temp - 32) * (5/9); // normalize to Celsius for advice
      if (condition.includes("rain")) return "Looks like rain – don’t forget your umbrella! ☔";
      if (c > 30) return "It's quite hot today – stay hydrated! 🧃";
      if (c < 5) return "Chilly outside – wear something warm! 🧣";
      return "Weather looks pleasant – have a nice day! 😊";
    }

    function applySettings() {
      const city = document.getElementById('cityInput').value;
      const lang = document.getElementById('langSelect').value;
      const units = document.getElementById('unitSelect').value;
      const fontSize = document.getElementById('fontSizeSelect').value;
      const fontFamily = document.getElementById('fontFamilySelect').value;

      document.getElementById('widget').style.fontSize = fontSize;
      document.getElementById('widget').style.fontFamily = fontFamily;

      renderWidget(city, lang, units);
    }

    // Initial load
    renderWidget("London");
  </script>

</body>
</html>
